name: Bug report
description: Report a reproducible problem using fictional or redacted data.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a small fictional project if needed. Do not attach private home data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and version or commit
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or console errors
